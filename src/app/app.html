<main class="main">
  <header class="app-header">
    <div class="brand-label">
      <span class="brand-line"></span>
      THE WRITING STUDIO
      <span class="brand-line"></span>
    </div>

    <h1>Text <span>Analyzer</span></h1>

    <p>Analyze your words. Refine your expression.</p>
  </header>
  <section class="editor-section">
    <label for="textarea">Your text</label>
    <textarea
      class="text-editor"
      [value]="text()"
      (input)="onTextInput($event)"
      (select)="onTextSelect($event)"
      (keyup)="onTextSelect($event)"
      (mouseup)="onTextSelect($event)"
      placeholder="Enter or paste your text here..."
    ></textarea>

    <div class="text-stats">
      <p class="characters-count">{{ characterCount() }} characters</p>
      <p class="words-count">{{ wordCount() }} words</p>
    </div>
    <div class="editor-actions">
      <button type="button" (click)="copyText()">Copy text</button>
      <button type="button" (click)="clearText()">Clear</button>
    </div>
  </section>
  <app-synonyms
    [selectedText]="selectedText()"
    [selectionVersion]="selectionVersion()"
    (replace)="replaceSelectedText($event)"
  ></app-synonyms>
</main>
